<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="medias/icon.png" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>PerfuseLab - Relatório</title>
</head>
<body class="bg-slate-950">
    <header class="max-w-5xl m-auto px-2">
        <h1 class="text-slate-100 text-3xl text-center mt-5">Relatório de <span class="text-[#F2071B]">PerfuseLab</span></h1>
    </header>
    <hr class="text-slate-400 mt-5">

    <main class="justify-center max-w-7xl m-auto mb-10">
        <section id="dados-paciente" class="mt-5">
            <h2 class="text-slate-100 text-2xl">Dados do Paciente</h2>
            <div id="historicoExames" class="text-slate-400 text-lg mt-5"></div>
        </section>

        <section id="graficos" class="mt-10">
            <h2 class="text-slate-100 text-2xl">Gráficos</h2>
            <div id="localGraficos" class="mt-5"></div>
        </section>
    </main>

    <script src="js/charts.js"></script>
    <script src="js/reportGenerator.js"></script>
</body>
</html>
